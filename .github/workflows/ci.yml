name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: scheme-b2b-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Package integrity
        run: python -m pip check

      - name: Tests
        run: pytest -q

      - name: Coverage
        run: pytest --cov=scheme_b2b --cov-report=term-missing --cov-fail-under=70

      - name: Docker build
        run: docker build --tag scheme-b2b:ci .
