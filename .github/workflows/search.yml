name: SCHEME-B2B Search

on:
  workflow_dispatch:
  schedule:
    - cron: "7 3 * * *"
      timezone: "Europe/Moscow"
    - cron: "7 11 * * *"
      timezone: "Europe/Moscow"
    - cron: "7 19 * * *"
      timezone: "Europe/Moscow"

concurrency:
  group: scheme-b2b-search
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  search:
    if: ${{ vars.SCHEME_B2B_SEARCH_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIRTABLE_BASE_ID: "appI8LyuBMv5z468N"
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      FNS_VERIFY_TOKEN: ${{ secrets.FNS_VERIFY_TOKEN }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install .

      - name: Search
        run: python -m scheme_b2b run-once

      - name: Deliver notifications
        run: python -m scheme_b2b dispatch-outbox
